plugins { id 'com.android.application' }
android {
    namespace 'com.nova.signaltrader'
    compileSdk 34
    defaultConfig {
        applicationId "com.nova.signaltrader"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Cronet native .so sirf in ABIs ke liye (APK size control)
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Chromium network stack — real Chrome TLS fingerprint (stealth)
}
