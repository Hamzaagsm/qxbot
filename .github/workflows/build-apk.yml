name: Build QxBot APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon -x lint
      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HamzaQxBot.apk
          ls -la HamzaQxBot.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HamzaQxBot-apk
          path: HamzaQxBot.apk
